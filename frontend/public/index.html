<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Primary Meta Tags -->
    <title>PeerEval - Peer Evaluation System for Education</title>
    <meta name="title" content="PeerEval - Peer Evaluation System for Education" />
    <meta name="description" content="A comprehensive peer evaluation platform for educators. Facilitate team assessments, track student progress, and generate detailed reports with customizable rubrics." />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <meta property="og:description" content="A comprehensive peer evaluation platform for educators. Facilitate team assessments, track student progress, and generate detailed reports." />

    <meta property="twitter:title" content="PeerEval - Peer Evaluation System for Education" />

    <!-- Canonical URL - update this to your production domain -->

      "name": "PeerEval",
      "description": "A comprehensive peer evaluation platform for educators to facilitate team assessments and track student progress.",

        "Dark mode interface"
      ]
